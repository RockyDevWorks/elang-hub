name: CI

on:
  push:
    branches: [main, 'feat/**', 'release/**']
  pull_request:
    branches: [main]

# Cancel in-progress runs when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (Prettier + ESLint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        # NOSONAR: allowScripts in package.json explicitly allows only esbuild and workerd
        run: npm ci

      - name: Run linter
        run: npm run lint

  typecheck:
    name: Type Checking (svelte-check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        # NOSONAR: allowScripts in package.json explicitly allows only esbuild and workerd
        run: npm ci

      - name: Run type checking
        run: npm run check

  build:
    name: Build (Cloudflare)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        # NOSONAR: allowScripts in package.json explicitly allows only esbuild and workerd
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-output
          path: .svelte-kit/cloudflare
          retention-days: 7

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
          cache: 'npm'

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

  test:
    name: Test (Vitest) + Codecov
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        # NOSONAR: allowScripts in package.json explicitly allows only esbuild and workerd
        run: npm ci

      # The SDK adapter tests live under `src/` and resolve path
      # aliases via the SvelteKit-generated tsconfig. `svelte-kit
      # sync` materialises `.svelte-kit/tsconfig.json`; running it
      # before vitest mirrors the typecheck job and avoids CI-only
      # resolution failures.
      - name: Sync SvelteKit type configuration
        run: npx svelte-kit sync

      # `npm run coverage` produces `coverage/lcov.info` consumed by
      # the Codecov uploader below.
      - name: Run unit tests with coverage
        run: npm run coverage

      # Codecov upload is best-effort: it requires a `CODECOV_TOKEN`
      # repo secret because the `release/*` branches are protected.
      # The token is obtained from https://app.codecov.io/ after
      # connecting the repo. Until the secret is configured, this
      # step logs the error and continues — coverage is still
      # generated locally and is visible via `npm run coverage`.
      - name: Upload coverage to Codecov
        # codecov-action is pinned to an immutable commit SHA per the
        # repo's supply-chain policy (mutable tag refs can be force-
        # pushed by upstream). v5.5.5 = 0fb7174895f61a3b6b78fc075e0cd60383518dac
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        continue-on-error: true
        with:
          files: ./coverage/lcov.info
          flags: unit
          fail_ci_if_error: false
          # Pass the token if it is configured in repo secrets; the
          # action will skip gracefully when the variable is empty.
          token: ${{ secrets.CODECOV_TOKEN }}
