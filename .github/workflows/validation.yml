name: Validation

# The "validation" suite complements `ci.yml` (lint / typecheck / build
# / test) with the third-party code-quality, secret-scanning, link,
# and SBOM tools the elang-rs / elang-hub org standardizes on. The
# local equivalent is `scripts/validate-local.sh`, callable as
# `npm run validate` from the repo root.
#
# Two menus live here so the elang-hub and elang-rs validation
# surfaces stay aligned. Rust-only tools (cargo-fuzz, proptest, miri,
# cargo-mutants, cargo-hack, cargo-server-checks) are listed for
# symmetry but exit 0 because elang-hub has no Rust source — they
# have work to do on RockyDevWorks/elang-rs and that work is tracked
# separately.
#
# Tools are installed directly inside each job (npm, curl + binary,
# pip) rather than via third-party Actions wrappers. The Hub's
# supply-chain policy pins third-party Actions by immutable SHA;
# when each tool grows a wrapper we trust, it can replace the
# install step without changing the rest of the job.

on:
  push:
    branches: [main, 'feat/**', 'release/**']
  pull_request:
    branches: [main, 'release/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ───────────────────────────────────────────────────────────────────────
  # Tools that have work to do on elang-hub
  # ───────────────────────────────────────────────────────────────────────

  jscpd:
    name: Jscpd (copy-paste detection)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
          cache: 'npm'
      - run: npm ci
      - name: Run Jscpd
        # `npx --yes` fetches the latest minor of the pinned major on
        # first run; the version is locked into `package-lock.json`
        # via the optional devDependency below.
        run: npx --yes jscpd@3 --config .jscpd.json src

  knip:
    name: Knip (unused exports / files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
          cache: 'npm'
      - run: npm ci
      - name: Run Knip
        # Knip surfaces unused exports / files / dependencies as
        # findings but should not block merge — a new unused export
        # is a review item, not a CI failure. `--no-exit-code`
        # (replaces the v4 `--exit-zero` flag) makes the job green
        # when there are findings so the report still prints.
        run: npx --yes knip@5 --no-exit-code

  gitleaks:
    name: Gitleaks (secret scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Gitleaks needs the full git history, not the shallow
          # clone the default checkout uses.
          fetch-depth: 0
      - name: Run Gitleaks
        run: |
          # Download the pinned release binary directly. Pinned by
          # tag (v8.30.1) — the project's release tarball is the
          # canonical install path.
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/
          gitleaks detect --source . --no-banner --config .gitleaks.toml

  zizmor:
    name: Zizmor (GitHub Actions YAML linter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Run Zizmor
        # Pip-installed zizmor is the official path — the same
        # binary `woodruffw/zizmor-action` wraps. `--persona=regular`
        # minimizes false positives; `--no-exit-codes` ensures that
        # any finding surfaces in the job log without failing the
        # PR. A real zizmor regression (high severity + high
        # confidence) gets caught in review via the inline
        # annotations; a new cache-poisoning or artipacked finding
        # (low confidence) is a review item, not a CI failure.
        run: |
          pip install zizmor==1.9.0
          zizmor --persona=regular --no-exit-codes --format github .github/workflows

  lychee:
    name: Lychee (link checker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run Lychee
        run: |
          # Binary download from the pinned release tag. Lychee has
          # no npm or pip distribution; the official install path is
          # a GitHub release tarball. Note the tag prefix
          # `lychee-v` — the project prefixes release tags.
          curl -sSfL \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz" \
            -o /tmp/lychee.tar.gz
          tar -xzf /tmp/lychee.tar.gz -C /tmp
          # The tarball unpacks to a subdirectory named for the
          # target triple; strip that prefix to land the binary at
          # /usr/local/bin/lychee directly.
          sudo mv /tmp/lychee-x86_64-unknown-linux-gnu/lychee /usr/local/bin/
          # `.lycheeignore` is auto-detected; URL/host patterns live
          # there. File-system exclusions use `--exclude-path`.
          lychee --offline --no-progress \
            --exclude-path coverage \
            --exclude-path .svelte-kit \
            --exclude-path build \
            --exclude-path dist \
            --exclude-path .wrangler \
            --exclude-path lcov-report \
            --exclude-path node_modules \
            --format markdown \
            '**/*.md' '**/*.ts' '**/*.svelte'

  syft:
    name: Syft (SBOM generation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Generate SBOM
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/v1.55.0/install.sh \
            -o /tmp/syft-install.sh
          syft_bin="$RUNNER_TEMP/syft-bin"
          mkdir -p "$syft_bin"
          sh /tmp/syft-install.sh -b "$syft_bin" v1.55.0
          export PATH="$syft_bin:$PATH"
          # `dir:.` is the explicit directory scheme; `syft scan .`
          # also works but the explicit scheme is unambiguous.
          syft scan dir:. -o spdx-json > elang-hub.spdx.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        with:
          name: elang-hub-sbom
          path: elang-hub.spdx.json
          retention-days: 30

  scorecard:
    name: OpenSSF Scorecard
    # Posture scoring — runs on push to main, scheduled, and
    # manual dispatch only (matches `security.yml`); skipped on PRs
    # because Scorecard needs push-event metadata the PR event does
    # not expose.
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@46dc3187a971a9febf3aeb7f94ccde489f7bb46a # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@5c8ea125689a2c5ae2672d1d914ac4bcd95d1b4b # v3
        with:
          sarif_file: results.sarif

  # ───────────────────────────────────────────────────────────────────────
  # Rust-only tools — listed for menu parity with elang-rs.
  # The guard fails if Rust source appears under src until real
  # checks are installed. The placeholder jobs run only when no
  # Rust source is present.
  # ───────────────────────────────────────────────────────────────────────

  _rust-source-guard:
    name: Rust source guard
    runs-on: ubuntu-latest
    outputs:
      has-rust: ${{ steps.scan.outputs.has-rust }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: scan
        run: |
          if find src -name '*.rs' -print -quit | grep -q .; then
            echo 'has-rust=true' >> "$GITHUB_OUTPUT"
            echo '::error::Rust source detected under src; install the Rust validation checks before proceeding.'
            exit 1
          else
            echo 'has-rust=false' >> "$GITHUB_OUTPUT"
          fi

  cargo-fuzz:
    name: cargo-fuzz (Rust fuzzing) [no Rust source]
    needs: _rust-source-guard
    if: needs._rust-source-guard.outputs.has-rust == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: No Rust source — not applicable
        run: |
          echo 'cargo-fuzz is a Rust-only tool; elang-hub has no Rust source.'
          echo 'It runs on RockyDevWorks/elang-rs against the elang-rs fuzz targets.'
          exit 0

  proptest:
    name: proptest (property-based tests) [no Rust source]
    needs: _rust-source-guard
    if: needs._rust-source-guard.outputs.has-rust == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: No Rust source — not applicable
        run: |
          echo 'proptest is a Rust-only property-testing crate; elang-hub has no Rust source.'
          echo 'Property tests for elang-rs live in crates/elang-*/src/**_prop.rs.'
          exit 0

  cargo-mutants:
    name: cargo-mutants (mutation testing) [no Rust source]
    needs: _rust-source-guard
    if: needs._rust-source-guard.outputs.has-rust == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: No Rust source — not applicable
        run: |
          echo 'cargo-mutants is a Rust-only mutation tester; elang-hub has no Rust source.'
          echo 'It runs on RockyDevWorks/elang-rs against the elang-rs workspace.'
          exit 0

  cargo-hack:
    name: cargo-hack (feature flag matrix) [no Rust source]
    needs: _rust-source-guard
    if: needs._rust-source-guard.outputs.has-rust == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: No Rust source — not applicable
        run: |
          echo 'cargo-hack exercises every feature combination in a Cargo workspace.'
          echo 'elang-hub has no Cargo.toml; the elang-rs workflow runs the matrix.'
          exit 0

  cargo-server-checks:
    name: cargo-server-checks (server crate audit) [no Rust source]
    needs: _rust-source-guard
    if: needs._rust-source-guard.outputs.has-rust == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: No Rust source — not applicable
        run: |
          echo 'cargo-server-checks audits Rust HTTP server crates; elang-hub has no Rust source.'
          echo 'It runs on RockyDevWorks/elang-rs against crates/elang-server.'
          exit 0

  miri:
    name: Miri (Rust undefined behavior detector) [no Rust source]
    needs: _rust-source-guard
    if: needs._rust-source-guard.outputs.has-rust == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: No Rust source — not applicable
        run: |
          echo 'Miri interprets Rust mid-level IR to catch undefined behavior.'
          echo 'elang-hub has no Rust source; Miri runs on RockyDevWorks/elang-rs.'
          exit 0
