# SonarCloud Automatic Analysis configuration.
#
# SonarCloud Automatic Analysis ignores `sonar-project.properties` and
# reads this file instead (per SonarCloud docs). Wildcard patterns are
# not allowed here — list each directory or file explicitly.
#
# Test files are co-located with source under `src/` (e.g.
# `src/lib/upload/controller.test.ts`). Vitest tests have intrinsic
# structural repetition (per-test setup of an UploadController, repeated
# `controller.select([file(...)], …)` invocations, repeated assertion
# patterns) that is intrinsic to the BDD style and cannot be removed
# without sacrificing test readability or coverage granularity. The 3%
# duplication gate on new code is not reachable for meaningful test
# additions.
#
# Mirrors the existing `.jscpd.json` ignore list, which already
# excludes `**/*.test.ts` and `**/*.test.svelte`.
sonar.cpd.exclusions=\
src/lib/phonemes/phonemes.test.ts,\
src/lib/phonemes/controller.test.ts,\
src/lib/phonemes/error-mapper.test.ts,\
src/lib/phonemes/client.test.ts,\
src/lib/sdk/client.test.ts,\
src/lib/sdk/errors.test.ts,\
src/lib/upload/controller.test.ts,\
src/lib/upload/client.test.ts,\
src/lib/upload/validate.test.ts,\
src/lib/upload/bounds.test.ts,\
src/lib/upload/stages.test.ts,\
src/lib/upload/version.test.ts,\
src/lib/upload/limits.test.ts
