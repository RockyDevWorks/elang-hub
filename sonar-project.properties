sonar.projectKey=RockyDevWorks_elang-hub
sonar.organization=rockydevworks

# Source directories
sonar.sources=src

# Exclusions
sonar.exclusions=**/node_modules/**,.svelte-kit/**,build/**,dist/**

# Issue exclusions: Suppress install script warnings in CI workflows
# Rationale: Install scripts are controlled via package.json allowScripts
# configuration, which explicitly allows only esbuild and workerd (required
# for Vite and Cloudflare adapter). This is more secure than blanket
# --ignore-scripts flag.
sonar.issue.ignore.multicriteria=e1

# Suppress: "Omitting --ignore-scripts allows lifecycle scripts..."
sonar.issue.ignore.multicriteria.e1.ruleKey=yaml:S6330
sonar.issue.ignore.multicriteria.e1.resourceKey=.github/workflows/ci.yml
