sonar.projectKey=RockyDevWorks_elang-hub
sonar.organization=rockydevworks

# Source directories
sonar.sources=src

# Exclusions
sonar.exclusions=**/node_modules/**,.svelte-kit/**,build/**,dist/**

# CPD (copy-paste detection) exclusions: test files mirror the
# existing `.jscpd.json` ignore list. Vitest test files have a
# non-trivial amount of structural repetition (per-test setup of
# an UploadController, repeated `controller.select([file(...)], …)`
# invocations, repeated assertion patterns) that is intrinsic to
# the BDD style and cannot be removed without sacrificing test
# readability or coverage granularity. The 3% duplication gate on
# new code is not reachable for meaningful test additions.
sonar.cpd.exclusions=**/*.test.ts,**/*.test.svelte,**/test-fixtures.ts,**/test-helpers.ts,**/flow-harness.ts

# Issue exclusions: Suppress install script warnings in CI workflows
# Rationale: Install scripts are controlled via package.json allowScripts
# configuration, which explicitly allows only esbuild and workerd (required
# for Vite and Cloudflare adapter). This is more secure than blanket
# --ignore-scripts flag.
sonar.issue.ignore.multicriteria=e1

# Suppress: "Omitting --ignore-scripts allows lifecycle scripts..."
sonar.issue.ignore.multicriteria.e1.ruleKey=yaml:S6330
sonar.issue.ignore.multicriteria.e1.resourceKey=.github/workflows/ci.yml
