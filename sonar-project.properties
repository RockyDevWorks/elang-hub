sonar.projectKey=RockyDevWorks_elang-hub
sonar.organization=rockydevworks

# Source directories
sonar.sources=src

# Test files are co-located with source under `src/` (e.g.
# `src/lib/upload/controller.test.ts`). Mark them explicitly so
# SonarCloud scopes them as tests rather than production code,
# which in turn excludes them from CPD by default.
sonar.test.inclusions=**/*.test.ts,**/*.test.svelte,**/test-fixtures.ts,**/test-helpers.ts,**/flow-harness.ts

# Exclusions
sonar.exclusions=**/node_modules/**,.svelte-kit/**,build/**,dist/**

# CPD (copy-paste detection) exclusions: redundant with
# `sonar.test.inclusions` for the test files themselves, but kept
# for explicitness and to cover any test-shaped fixtures that fall
# outside the test scope. Vitest tests have intrinsic structural
# repetition (per-test setup of an UploadController, repeated
# `controller.select([file(...)], …)` invocations, repeated
# assertion patterns) that is intrinsic to the BDD style and
# cannot be removed without sacrificing test readability or
# coverage granularity. The 3% duplication gate on new code is
# not reachable for meaningful test additions.
sonar.cpd.exclusions=**/*.test.ts,**/*.test.svelte,**/test-fixtures.ts,**/test-helpers.ts,**/flow-harness.ts

# Issue exclusions: Suppress install script warnings in CI workflows
# Rationale: Install scripts are controlled via package.json allowScripts
# configuration, which explicitly allows only esbuild and workerd (required
# for Vite and Cloudflare adapter). This is more secure than blanket
# --ignore-scripts flag.
sonar.issue.ignore.multicriteria=e1

# Suppress: "Omitting --ignore-scripts allows lifecycle scripts..."
sonar.issue.ignore.multicriteria.e1.ruleKey=yaml:S6330
sonar.issue.ignore.multicriteria.e1.resourceKey=.github/workflows/ci.yml
